{% extends "base.html" %}
{% block title %}Edit Company — Networking CRM{% endblock %}

{% block content %}
<div class="row mb-4">
    <div class="col">
        <h2 class="fw-bold">Edit Company</h2>
        <p class="text-muted">{{ company.name }}</p>
    </div>
    <div class="col-auto">
        <a href="{{ url_for('companies') }}" class="btn btn-outline-secondary">
            <i class="bi bi-arrow-left"></i> Back
        </a>
    </div>
</div>

<div class="card p-4">
    <form method="POST">
        <div class="row g-3 mb-4">
            <div class="col-md-6">
                <label class="form-label">Company Name <span class="text-danger">*</span></label>
                <input type="text" name="name" class="form-control" required
                       value="{{ request.form.get('name', company.name) }}">
            </div>
            <div class="col-md-6">
                <label class="form-label">Industry</label>
                <input type="text" name="industry" class="form-control"
                       value="{{ request.form.get('industry', company.industry or '') }}">
            </div>
            <div class="col-md-6">
                <label class="form-label">Website</label>
                <input type="url" name="website" class="form-control"
                       value="{{ request.form.get('website', company.website or '') }}">
            </div>
            <div class="col-12">
                <label class="form-label">Notes</label>
                <textarea name="notes" class="form-control" rows="3">{{ request.form.get('notes', company.notes or '') }}</textarea>
            </div>
        </div>

        <div class="d-flex gap-2">
            <button type="submit" class="btn btn-primary">
                <i class="bi bi-check-lg"></i> Save Changes
            </button>
            <a href="{{ url_for('companies') }}" class="btn btn-outline-secondary">Cancel</a>
        </div>
    </form>
</div>
{% endblock %}
