{% extends "base.html" %}
{% block title %}Add Company — Networking CRM{% endblock %}

{% block content %}
<div class="row mb-4">
    <div class="col">
        <h2 class="fw-bold">Add Company</h2>
    </div>
    <div class="col-auto">
        <a href="{{ url_for('companies') }}" class="btn btn-outline-secondary">
            <i class="bi bi-arrow-left"></i> Back
        </a>
    </div>
</div>

<div class="card p-4">
    <form method="POST">
        <div class="row g-3 mb-4">
            <div class="col-md-6">
                <label class="form-label">Company Name <span class="text-danger">*</span></label>
                <input type="text" name="name" class="form-control" required value="{{ request.form.get('name', '') }}">
            </div>
            <div class="col-md-6">
                <label class="form-label">Industry</label>
                <input type="text" name="industry" class="form-control" value="{{ request.form.get('industry', '') }}">
            </div>
            <div class="col-md-6">
                <label class="form-label">Website</label>
                <input type="url" name="website" class="form-control" placeholder="https://..." value="{{ request.form.get('website', '') }}">
            </div>
            <div class="col-12">
                <label class="form-label">Notes</label>
                <textarea name="notes" class="form-control" rows="3">{{ request.form.get('notes', '') }}</textarea>
            </div>
        </div>

        <div class="d-flex gap-2">
            <button type="submit" class="btn btn-primary">
                <i class="bi bi-building-add"></i> Add Company
            </button>
            <a href="{{ url_for('companies') }}" class="btn btn-outline-secondary">Cancel</a>
        </div>
    </form>
</div>
{% endblock %}
